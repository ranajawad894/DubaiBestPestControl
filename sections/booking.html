```html
<section id="booking" class="py-20 bg-white">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="bg-slate-900 text-white rounded-3xl p-8 sm:p-12 shadow-2xl relative overflow-hidden">

            <div class="absolute -left-20 -top-20 w-80 h-80 bg-brand-600/20 rounded-full blur-3xl"></div>

            <div class="relative z-10 text-center max-w-2xl mx-auto mb-10">
                <span
                    class="text-brand-400 font-bold text-xs uppercase tracking-widest bg-brand-500/10 px-3 py-1 rounded-full border border-brand-500/20">
                    Online Scheduling
                </span>

                <h2 class="text-3xl sm:text-4xl font-extrabold mt-3">
                    Book Your Pest Control Inspection
                </h2>

                <p class="text-slate-300 text-sm mt-2">
                    Fill in your details below and our scheduling coordinator
                    will confirm your time slot instantly.
                </p>
            </div>

            <form id="main-booking-form" class="relative z-10 space-y-6" onsubmit="handleBookingSubmit(event)">

                <!-- Name + Phone -->
                <div class="grid sm:grid-cols-2 gap-6">

                    <div>
                        <label for="booking-name"
                            class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-2">
                            Full Name
                        </label>

                        <input type="text" id="booking-name" required placeholder="Ahmad"
                            class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3.5 text-white placeholder-slate-400 text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
                    </div>

                    <div>
                        <label for="booking-phone"
                            class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-2">
                            UAE Mobile Number
                        </label>

                        <input type="tel" id="booking-phone" required placeholder="+971 XX XXX XXXX"
                            class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3.5 text-white placeholder-slate-400 text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
                    </div>

                </div>

                <!-- Area + Service -->
                <div class="grid sm:grid-cols-2 gap-6">

                    <div>
                        <label for="booking-area"
                            class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-2">
                            Dubai Area / Community
                        </label>

                        <input type="text" id="booking-area" required placeholder="e.g. Dubai Marina, Tower A"
                            class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3.5 text-white placeholder-slate-400 text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
                    </div>

                    <div>
                        <label for="booking-service"
                            class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-2">
                            Service Required
                        </label>

                        <select id="booking-service" required
                            class="w-full bg-slate-800 border border-white/20 rounded-xl px-4 py-3.5 text-white text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
                            <option value="Bed Bug Treatment" class="bg-slate-900">
                                Bed Bug Treatment
                            </option>

                            <option value="Cockroach & Ant Gel Treatment" class="bg-slate-900">
                                Cockroach & Ant Gel Treatment
                            </option>

                            <option value="Termite Barrier Inspection" class="bg-slate-900">
                                Termite Barrier Inspection
                            </option>

                            <option value="Rodent Control" class="bg-slate-900">
                                Rodent Control
                            </option>

                            <option value="General Annual Maintenance Contract (AMC)" class="bg-slate-900">
                                General Annual Maintenance Contract (AMC)
                            </option>
                        </select>
                    </div>

                </div>

                <!-- Notes -->
                <div>

                    <label for="booking-notes"
                        class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-2">
                        Additional Notes / Preferred Date & Time
                    </label>

                    <textarea id="booking-notes" rows="3"
                        placeholder="Tell us about the pest issue or preferred timing..."
                        class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3.5 text-white placeholder-slate-400 text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none"></textarea>

                </div>

                <!-- Submit -->
                <button type="submit" id="booking-submit-btn"
                    class="w-full bg-brand-500 hover:bg-brand-600 text-white font-extrabold py-4 rounded-xl shadow-xl transition text-base flex items-center justify-center gap-2">
                    <i class="fa-solid fa-circle-check text-lg"></i>
                    Confirm & Schedule Appointment
                </button>

            </form>

        </div>
    </div>
</section>
